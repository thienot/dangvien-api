server:
  port: 8080

spring:
  application:
    name: dangvien-api
  datasource:
    url: jdbc:oracle:thin:@//localhost:1521/FREEPDB1
    username: ${DB_USERNAME:admin}
    password: ${DB_PASSWORD:admin}
    driver-class-name: oracle.jdbc.OracleDriver
    hikari:
      pool-name: DangVienHikariPool
      maximum-pool-size: 20       # Giới hạn tối đa 20 kết nối đồng thời tới Oracle
      minimum-idle: 5             # Luôn duy trì sẵn 5 kết nối nhàn rỗi để phục vụ ngay
      idle-timeout: 300000        # 5 phút giải phóng kết nối thừa
      connection-timeout: 30000  # 30 giây timeout nếu DB bận không cấp kết nối
      max-lifetime: 1800000      # 30 phút tự hủy và tạo kết nối mới (chống stale connection ở Oracle)
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: false        # TẮT format SQL trên production để tiết kiệm CPU và I/O đĩa

# Cau hinh rieng cho API dong-bo dang vien
app:
  dangvien:
    # Token TINH do BHXH cap cho VPTWD - nen override qua bien moi truong khi trien khai that
    token: ${DANGVIEN_API_TOKEN:33bdfccc-9046-488a-b2f0-2e503df74b1e}
    # So ban ghi toi da trong data[] moi lan goi (theo muc 4 tai lieu, co the dieu chinh)
    max-records: ${DANGVIEN_MAX_RECORDS:1000}

logging:
  level:
    vn.gov.bhxh.dangvien: INFO   # Production: chi ghi INFO tro len, DEBUG se tao 1000 dong/request
    org.springframework: WARN
    org.hibernate.SQL: WARN

# =====================================================================
# Resilience4j - Bao ve API khi VPTWD gui qua nhieu request dong thoi
# hoac Oracle qua tai.
#
# RateLimiter:    Gioi han 20 request/phut. VPTWD gui qua -> tra ngay
#                 429 TOO_MANY_REQUESTS, tranh bao Oracle.
# CircuitBreaker: Neu Oracle lien tuc loi (>50% trong 10 req cuoi)
#                 -> ngat mach 30s, tra 503 SERVICE_UNAVAILABLE ngay
#                    thay vi doi timeout 30 giay/request.
# =====================================================================
resilience4j:
  ratelimiter:
    instances:
      dongBoMoiLimiter:
        limit-for-period: ${RATE_LIMIT_PER_MINUTE:20}  # 20 request / refresh-period
        limit-refresh-period: 60s                       # Reset counter moi 60 giay
        timeout-duration: 0s                            # Tu choi ngay, khong xep hang cho
        register-health-indicator: true

  circuitbreaker:
    instances:
      dongBoMoiBreaker:
        register-health-indicator: true
        sliding-window-type: COUNT_BASED
        sliding-window-size: 10             # Xet 10 request gan nhat
        minimum-number-of-calls: 5          # Can it nhat 5 request truoc khi kich hoat CB
        failure-rate-threshold: 50          # >=50% that bai -> mo mach (OPEN)
        slow-call-rate-threshold: 80        # >=80% request cham (>10s) -> cung mo mach
        slow-call-duration-threshold: 10s   # Nguong coi la "request cham"
        wait-duration-in-open-state: 30s    # Sau 30s: chuyen HALF-OPEN de thu lai
        permitted-number-of-calls-in-half-open-state: 3
        automatic-transition-from-open-to-half-open-enabled: true

# Cau hinh Actuator cho giam sat suc khoe he thong tren Production
management:
  endpoints:
    web:
      exposure:
        include: health, info, metrics, circuitbreakers, ratelimiters
  endpoint:
    health:
      show-details: when-authorized
  health:
    circuitbreakers:
      enabled: true
    ratelimiters:
      enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
